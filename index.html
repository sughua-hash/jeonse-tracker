<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전월세 최저가</title>
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
  color-scheme: light dark;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f0efec; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --line:#e1e0d9; --border:rgba(11,11,11,.10);
  --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a;
  --down:#006300; --up:#c0392b; --down-bg:#e8f5e8; --up-bg:#fbe9e7; --flat-bg:#f0efec;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#262625; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --border:rgba(255,255,255,.10);
    --blue:#3987e5; --orange:#d95926; --aqua:#199e70;
    --down:#3ec43e; --up:#ff7b6b; --down-bg:#12301a; --up-bg:#3a1c19; --flat-bg:#262625;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
a{color:var(--blue)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:calc(var(--sat) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);font-size:18px;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.96)}
.bandsel{font:inherit;font-size:12px;font-weight:600;color:var(--blue);background:transparent;border:0;border-bottom:1px dashed var(--blue);border-radius:0;padding:0 2px;width:auto;display:inline;appearance:auto;-webkit-appearance:menulist-button}
.icon-btn.busy{animation:sp 1.2s linear infinite;color:var(--blue)}
@media (max-width:400px){.top h1{font-size:17px}.icon-btn{width:34px;height:34px;font-size:16px}.top-row{gap:6px}}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding:8px 16px calc(var(--sab) + 32px);max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--shadow);text-align:left;width:100%;display:block}
.card:active{background:var(--surface-2)}
.card .name{font-weight:650;font-size:16px;display:flex;align-items:center;gap:6px}
.card .region{font-size:12px;color:var(--muted);margin-top:1px}
.badge{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.rows{margin-top:10px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:36px 1fr;column-gap:8px;row-gap:3px;align-items:baseline}
.row .k{font-size:12px;color:var(--muted);grid-row:span 2;align-self:start;padding-top:3px}
.row .v{font-weight:650;font-variant-numeric:tabular-nums;font-size:17px;letter-spacing:-.01em}
.row .v small{font-weight:400;color:var(--ink-2);font-size:12px;margin-left:5px;letter-spacing:0}
.deltas{display:flex;gap:4px;grid-column:2;flex-wrap:wrap}
.d{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--flat-bg);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.d.down{background:var(--down-bg);color:var(--down)}
.d.up{background:var(--up-bg);color:var(--up)}
.d b{font-weight:500;opacity:.7;margin-right:2px}
.none{color:var(--muted);font-weight:400}
.areas{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:14px}
.alert{background:var(--up-bg);color:var(--up);border-radius:12px;padding:10px 12px;font-size:13px;margin:6px 0 10px}
.alert summary{cursor:pointer}
.alert pre{white-space:pre-wrap;margin:6px 0 0;font:12px/1.4 ui-monospace,monospace}
.note{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin:6px 0 10px}

/* detail */
.detail h2{font-size:20px;margin:6px 0 0;letter-spacing:-.01em}
.detail .region{color:var(--muted);font-size:13px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.panel h3{font-size:14px;margin:0 0 8px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.chart-wrap{position:relative;height:220px}
.chart-wrap.sm{height:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:4px 9px;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.list .it:last-child{border-bottom:0}
.list .p{font-weight:600;font-variant-numeric:tabular-nums}
.list .m{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--up);border:1px solid var(--up)}
.btn:disabled{opacity:.5}
.btn.sm{width:auto;padding:7px 12px;font-size:13px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:14px 18px calc(var(--sab) + 20px);max-height:88vh;overflow:auto}
.sheet h2{font-size:18px;margin:4px 0 12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field .help{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90vw;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.step{font-size:13px;color:var(--ink-2);line-height:1.55}
.ord{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.ord:last-child{border-bottom:0}
.ord .n{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord .n small{color:var(--muted);font-size:11px;margin-left:4px}
.ord .num{width:22px;font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ord button{width:34px;height:34px;border-radius:9px;background:var(--surface-2);font-size:15px;flex:none}
.ord button:disabled{opacity:.3}
.ord button.eye.off{opacity:.35}
.ord .n.hid{color:var(--muted);text-decoration:line-through}
.sheet{position:relative}
.sheet-x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:15px;display:grid;place-items:center}
.ord.mv{background:var(--surface-2);border-radius:8px}
.step ol{padding-left:18px;margin:6px 0}
code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div style="flex:1">
      <h1 id="title">전월세 최저가</h1>
      <div class="sub" id="subtitle">불러오는 중…</div>
    </div>
    <button class="icon-btn" id="btn-back" hidden title="뒤로">←</button>
    <button class="icon-btn" id="btn-collect" title="지금 수집">⟳</button>
    <button class="icon-btn" id="btn-order" title="순서 편집">↕</button>
    <button class="icon-btn" id="btn-add" title="단지 추가">＋</button>
    <button class="icon-btn" id="btn-settings" title="설정">⚙</button>
  </div>
</header>
<div class="chips" id="chips">
  <button class="chip" data-f="all">전체</button>
  <button class="chip" data-f="changed">오늘 변동</button>
  <button class="chip" data-f="jeonse_desc">전세가 높은순</button>
  <button class="chip" data-f="jeonse">전세가 낮은순</button>
  <button class="chip" data-f="conv">환산가 낮은순</button>
  <button class="chip" data-f="rent">월세 낮은순</button>
  <button class="chip" data-f="hidden" id="chip-hidden" hidden>숨김</button>
</div>
<main id="main"></main>
<div id="sheet-root"></div>
<div id="toast" class="toast" hidden></div>

<script src="./vendor/chart.umd.js"></script>
<script>
'use strict';
// ------------------------------------------------------------- 상태
const S = {
  cfg: null, latest: null, view: 'list', filter: safeGet('filter') || 'jeonse_desc', detailNo: null,
  charts: [], range: 90,
  settings: JSON.parse(safeGet('settings') || '{}'),
  localHidden: new Set(JSON.parse(safeGet('hidden') || '[]')),
  localOrder: JSON.parse(safeGet('order') || 'null'),
  band: safeGet('band') || '84',
};
function saveOrder(){ if (S.localOrder) safeSet('order', JSON.stringify(S.localOrder)); else { try{ localStorage.removeItem('order'); }catch(e){} } }
function orderComplexes(list){ if (!S.localOrder) return list; const idx = new Map(S.localOrder.map((n,i)=>[n,i])); return list.map((c,i)=>[idx.has(c.name)?idx.get(c.name):1e6+i, c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }
function saveHidden(){ safeSet('hidden', JSON.stringify([...S.localHidden])); }
function isHidden(it){ return !!(it.cfg.hidden || S.localHidden.has(it.name)); }
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function saveSettings(){ safeSet('settings', JSON.stringify(S.settings)); }

// GitHub 저장소 자동 추정 (username.github.io/repo/)
function guessRepo(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const seg = location.pathname.split('/').filter(Boolean);
  if (m && seg.length) return { owner: m[1], repo: seg[0] };
  return null;
}
function repoInfo(){
  if (S.settings.owner && S.settings.repo) return { owner: S.settings.owner, repo: S.settings.repo };
  return guessRepo();
}

// ------------------------------------------------------------- 포맷
const fmt = {
  money(v){ if (v == null) return '—'; v = Math.round(v);
    if (Math.abs(v) >= 10000) { const s = (v/10000).toFixed(2).replace(/\.?0+$/,''); return s + '억'; }
    return v.toLocaleString('ko-KR') + '만'; },
  delta(v, unit){ if (v == null) return null; if (v === 0) return { cls:'flat', txt:'=' };
    const a = Math.abs(v); const sign = v > 0 ? '▲' : '▼';
    const t = unit === 'rent' ? a.toLocaleString('ko-KR') : fmt.money(a);
    return { cls: v > 0 ? 'up' : 'down', txt: sign + t }; },
  date(s){ if (!s) return ''; const d = new Date(s); if (isNaN(d)) return s;
    const p = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
    const g = t => p.find(x => x.type === t)?.value || ''; return `${g('month')}/${g('day')} ${g('hour')}:${g('minute')}`; },
  md(s){ if (!s) return ''; const [y,m,d] = s.split('-'); return `${+m}/${+d}`; },
};
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms=2600){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=> t.hidden = true, ms); }

// ------------------------------------------------------------- 데이터
async function getJSON(path, fallback){
  try { const r = await fetch(`./${path}?t=${Date.now()}`, { cache: 'no-store' }); if (!r.ok) return fallback; return await r.json(); }
  catch(e){ return fallback; }
}
async function loadAll(){
  let [cfg, latest] = await Promise.all([getJSON('config/complexes.json', null), getJSON('data/latest.json', null)]);
  // GitHub Pages 는 커밋 후 반영까지 수 분 걸릴 수 있어, 토큰이 있으면 설정은 GitHub 에서 직접(최신 커밋 기준) 읽음 → 숨김·순서 편집이 바로 유지됨
  if (S.settings.token && repoInfo()) { try { cfg = (await readConfigFromGithub()).cfg; } catch(e){ /* 실패 시 Pages 사본 사용 */ } }
  S.cfg = cfg || { complexes: [] }; S.latest = latest;
  render();
}
// 설정 파일(진실) + 최신 수집 결과 병합
function mergedComplexes(){
  const byNo = new Map(), byName = new Map();
  for (const e of (S.latest?.complexes || [])) { if (e.complexNo) byNo.set(String(e.complexNo), e); byName.set(e.name, e); }
  return orderComplexes(S.cfg.complexes || []).map(c => {
    const e = (c.complexNo && byNo.get(String(c.complexNo))) || byName.get(c.name) || null;
    return { cfg: c, name: c.name, complexNo: c.complexNo || e?.complexNo || null,
      region: c.address || c.region || e?.region || '', today: e?.today || e?.last || null, error: e?.error || null, stale: !!(e && !e.today && e.last) };
  });
}
function dong(b){ b = String(b || ''); return /^\d+$/.test(b) ? b + '동' : b; }
function areaLine(t){ const a = t?.areas; if (!a || !Object.keys(a).length) return '';
  const parts = Object.entries(a).map(([k,v]) => `${k}㎡ ${v}건`); return `<div class="areas">전용면적 분포 · ${parts.join(' · ')}</div>`; }
function countLine(t){ const c = t?.counts; if (!c || !c.in_area) return '';
  const over = c.wolse - c.wolse_ok; return `<div class="areas">이 평형대 매물 ${c.in_area}건 · 전세 ${c.jeonse}건 · 월세 ${c.wolse}건${over > 0 ? ` (보증금 조건 초과 ${over}건)` : ''}</div>`; }
// 전일 대비 변동 여부 (수집기의 is_changed 와 같은 기준): 최저가 변경, 또는 매물이 생김/사라짐
function isChangedRec(t){ if (!t) return false; return ['jeonse','wolse_rent','wolse_conv'].some(k => { const d = t.deltas?.[k]?.d1; if (!d || !d.date) return false; const cur = metric(t, k), prev = d.prev ?? null; if ((cur == null) !== (prev == null)) return true; return cur != null && prev != null && cur !== prev; }); }
function goneNote(d, unit){ const p = d?.d1?.prev; if (p == null) return ''; return `<small>어제 ${unit === 'rent' ? p + '만' : fmt.money(p)} → 오늘 없음</small>`; }
function metric(rec, key){ if (!rec || !rec[key]) return null; return key==='jeonse' ? rec.jeonse.price : key==='wolse_rent' ? rec.wolse_rent.rent : rec.wolse_conv.conv; }
// ---- 평형대(전용면적 구간): 기본 구간은 설정의 area_min/max, 나머지는 수집기가 rec.bands[key]에 저장
const DEFAULT_BANDS = [
  { key:'84', label:'84㎡ (전용 83~85)', min:83, max:85, default:true },
  { key:'100', label:'86~105㎡', min:85.01, max:105 },
  { key:'115', label:'106~120㎡', min:105.01, max:120 },
  { key:'130', label:'121~140㎡', min:120.01, max:140 },
  { key:'150', label:'141㎡ 이상', min:140.01, max:9999 },
];
function bands(){
  const set = S.latest?.settings || S.cfg || {};
  const byKey = new Map(DEFAULT_BANDS.map(b => [b.key, { ...b }]));
  for (const b of (set.area_bands || S.cfg?.area_bands || [])) byKey.set(b.key, { ...(byKey.get(b.key) || {}), ...b });
  const out = [...byKey.values()].map(b => b.default ? { ...b, min: +set.area_min_m2 || b.min, max: +set.area_max_m2 || b.max, label: `${+set.area_min_m2 || b.min}~${+set.area_max_m2 || b.max}㎡ (84형)` } : b);
  out.push({ key: 'all', label: '전체 (모든 평형)', min: 0, max: 99999, all: true });  // 모든 구간을 합쳐서 봄
  return out;
}
function curBand(){ const bs = bands(); return bs.find(b => b.key === S.band) || bs.find(b => b.default) || bs[0]; }
// '전체' 평형: 기본 구간 + 모든 구간 기록을 합쳐 각 지표의 최저를 고른 가상 레코드
function allRec(t){
  const recs = [t, ...Object.values(t.bands || {})].filter(Boolean);
  const out = { jeonse: null, wolse_rent: null, wolse_conv: null, deltas: {}, counts: { all: t.counts?.all || 0, in_area: 0, jeonse: 0, wolse: 0, wolse_ok: 0 } };
  for (const r of recs) for (const k of ['in_area','jeonse','wolse','wolse_ok']) out.counts[k] += r.counts?.[k] || 0;
  for (const key of ['jeonse','wolse_rent','wolse_conv']) { let best = null;
    for (const r of recs) { const v = metric(r, key); if (v != null && (!best || v < best.v)) best = { v, r }; }
    if (best) { out[key] = best.r[key]; out.deltas[key] = best.r.deltas?.[key]; }
    else { const r = recs.find(r => r.deltas?.[key]?.d1?.prev != null); if (r) out.deltas[key] = r.deltas[key]; } }  // 어제는 있었는데 오늘 사라진 경우도 변동으로 잡히게
  return out;
}
function recFor(t){ if (!t) return null; const b = curBand(); return b.all ? allRec(t) : b.default ? t : (t.bands?.[b.key] || null); }
function bandCount(b){ return mergedComplexes().filter(it => !isHidden(it) && it.today).filter(it => { const r = b.all ? allRec(it.today) : b.default ? it.today : it.today.bands?.[b.key]; return r?.counts?.in_area > 0; }).length; }  // 이 평형대에 매물이 있는 단지 수
function bandSelectHtml(){ const cur = curBand(); return `<select id="band" class="bandsel" title="평형 선택">${bands().map(b => `<option value="${esc(b.key)}" ${b.key===cur.key?'selected':''}>${esc(b.label)} · ${bandCount(b)}개 단지</option>`).join('')}</select>`; }
function bindBand(){ document.getElementById('band')?.addEventListener('change', e => { S.band = e.target.value; safeSet('band', S.band); render(); }); }
function inBand(a){ const b = curBand(); if (b.all) return true; const x = +a.area_exclusive; return x >= b.min && x <= b.max; }
function convWithRate(dep, rent){ const rate = +(S.cfg?.conversion_rate_pct || 5.5); return Math.round(dep + rent*12*100/rate); }

function render(){
  destroyCharts();
  document.getElementById('btn-back').hidden = S.view === 'list';
  document.getElementById('btn-add').hidden = S.view !== 'list';
  document.getElementById('btn-order').hidden = S.view !== 'list';
  document.getElementById('btn-collect').hidden = S.view !== 'list';
  document.getElementById('chips').hidden = S.view !== 'list';
  if (S.view === 'list') renderList(); else renderDetail();
}
function destroyCharts(){ S.charts.forEach(c => c.destroy()); S.charts = []; }

function deltaChips(d, unit){
  if (!d) return '';
  return `<div class="deltas">${['d1','d7','d30'].map((k,i)=>{
    const x = fmt.delta(d[k]?.delta, unit); const lab = ['일','주','월'][i];
    if (!x && d[k]?.date && d[k].prev == null) return `<span class="d up"><b>${lab}</b>신규</span>`;  // 비교일엔 매물이 없었는데 오늘 생김
    if (!x) return `<span class="d"><b>${lab}</b>—</span>`;
    return `<span class="d ${x.cls}"><b>${lab}</b>${x.txt}</span>`; }).join('')}</div>`;
}

    ? `마지막 수집 ${fmt.date(L.generated_at)} · 전용 ${bandSelectHtml()} · 월세 보증금 ≤${fmt.money(set.wolse_deposit_max_manwon)}`
    : '아직 수집된 데이터가 없습니다';

  let items = mergedComplexes();

  const chipH = document.getElementById('chip-hidden'); chipH.hidden = hiddenCount === 0 && S.filter !== 'hidden'; chipH.textContent = `숨김 ${hiddenCount}`;
  items = items.filter(it => S.filter === 'hidden' ? isHidden(it) : !isHidden(it));

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawCharts(h){
  if (!window.Chart) return;
  const labels = h.map(r => fmt.md(r.date));
  const ink2 = cssVar('--ink-2'), line = cssVar('--line'), muted = cssVar('--muted');
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = ink2;
  const base = (color, data, lbl) => ({ label: lbl, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: h.length > 60 ? 0 : 3, pointHoverRadius: 5, tension: .15, spanGaps: false });
  const opts = (yfmt, extra) => ({ responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${yfmt(c.parsed.y)}${extra ? extra(c) : ''}` } } },
    scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 6, color: muted } },
              y: { grid: { color: line }, border: { display: false }, ticks: { maxTicksLimit: 5, color: muted, callback: v => yfmt(v) } } } });
  const c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
  if (c1) S.charts.push(new Chart(c1, { type: 'line', data: { labels, datasets: [
      base(cssVar('--blue'), h.map(r => r.jeonse ? r.jeonse.price/10000 : null), '전세 최저'),
      base(cssVar('--orange'), h.map(r => r.wolse_conv ? r.wolse_conv.conv/10000 : null), '환산가 최저') ] },
    options: opts(v => (+v).toFixed(2).replace(/\.?0+$/,'') + '억', c => { const r = h[c.dataIndex]; if (c.datasetIndex === 1 && r?.wolse_conv) return ` (보증금 ${fmt.money(r.wolse_conv.deposit)} / 월 ${r.wolse_conv.rent}만)`; if (c.datasetIndex === 0 && r?.jeonse?.article) return ` (${dong(r.jeonse.article.building)} ${r.jeonse.article.floor}층)`; return ''; }) }));
  if (c2) S.charts.push(new Chart(c2, { type: 'line', data: { labels, datasets: [ base(cssVar('--aqua'), h.map(r => r.wolse_rent ? r.wolse_rent.rent : null), '월세액 최저') ] },
    options: opts(v => Math.round(v).toLocaleString('ko-KR') + '만', c => { const w = h[c.dataIndex]?.wolse_rent; return w ? ` / 보증금 ${fmt.money(w.deposit)}` : ''; }) }));
}

// ------------------------------------------------------------- GitHub API
function b64encodeUtf8(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin); }
function b64decodeUtf8(b64){ const bin = atob(b64.replace(/\s/g,'')); const bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
async function gh(path, opts={}){
  const info = repoInfo(); if (!info) throw new Error('GitHub 저장소를 알 수 없습니다. 설정에서 owner/repo를 입력하세요.');
  if (!S.settings.token) throw new Error('설정에서 GitHub 토큰을 먼저 입력하세요.');
  const r = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}${path}`, { ...opts,
    headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${S.settings.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers||{}) } });
  if (r.status === 204) return null;
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.message || `GitHub API ${r.status}`);
  return j;
}
async function readConfigFromGithub(){
  // contents API 를 ref=main 으로 읽으면 방금 커밋한 내용이 잠시(수십 초) 옛 버전으로 올 수 있음 → 최신 커밋 sha 를 먼저 받아 그 sha 로 고정해 읽음
  const ref = await gh(`/git/ref/heads/main?t=${Date.now()}`, { cache: 'no-store' });
  const j = await gh(`/contents/config/complexes.json?ref=${ref.object.sha}&t=${Date.now()}`, { cache: 'no-store' });
  return { cfg: JSON.parse(b64decodeUtf8(j.content)), sha: j.sha };
}
function parseComplexNo(url){ const m = url.match(/(?:complexes\/|complex\/info\/|hscpNo=|complexNo=|complexNumber=)(\d+)/) || url.match(/^(\d{3,8})$/); return m ? m[1] : null; }
async function saveComplexUrl(it, url){
  url = (url || '').trim();
  if (!url) return toast('링크를 붙여 넣으세요');
  const no = parseComplexNo(url);
  if (!no && !/^https?:\/\/\S+$/i.test(url)) return toast('URL 형식이 아닙니다. 네이버 부동산 공유 링크(https://naver.me/… 등)를 붙여 주세요', 4000);
  try {
    const { cfg, sha } = await readConfigFromGithub();
    const c = cfg.complexes.find(x => x.name === it.name);
    if (!c) throw new Error('설정에서 단지를 찾지 못했습니다');
    if (no) { c.complexNo = no; delete c.url; } else { c.url = url; delete c.complexNo; }
    await writeConfig(cfg, sha, `config: url ${it.name}`);
    S.cfg = cfg; S.detailNo = no || null; S.detailName = it.name;
    toast(no ? '단지번호 저장 완료 · 상단 ⟳로 바로 수집해 보세요' : '링크 저장 완료 · 다음 수집(⟳) 때 단지번호를 알아냅니다', 4500);
    goList();
  } catch(e){ toast('실패: ' + e.message, 4000); }
}
async function writeConfig(cfg, sha, message){
  await gh('/contents/config/complexes.json', { method: 'PUT', body: JSON.stringify({ message, sha, branch: 'main', content: b64encodeUtf8(JSON.stringify(cfg, null, 2) + '\n') }) });
}

function openSheet(html){ const root = document.getElementById('sheet-root'); root.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet"><div class="grip"></div><button class="sheet-x" id="sheet-x" title="닫기">✕</button>${html}</div></div>`;
  root.querySelector('#sheet-bg').addEventListener('click', e => { if (e.target.id === 'sheet-bg') closeSheet(); });
  root.querySelector('#sheet-x').addEventListener('click', () => closeSheet());
  history.pushState({ sheet: true }, ''); }
// 시트/상세는 브라우저 히스토리에 한 단계씩 쌓아서, 폰의 뒤로가기 버튼이 앱 안에서 동작하게 함
function closeSheet(fromPop){ if (!fromPop && history.state?.sheet) { history.back(); return; } document.getElementById('sheet-root').innerHTML = ''; }
function openDetail(no, name){ S.detailNo = no; S.detailName = name; S.view = 'detail'; history.pushState({ v: 'detail' }, ''); render(); window.scrollTo(0,0); }
function goList(){ if (history.state?.v === 'detail') history.back(); else { S.view = 'list'; render(); } }

function openAdd(){
  openSheet(`<h2>단지 추가</h2>
    <div class="field"><label>단지 이름 *</label><input id="a-name" placeholder="예: 위례센트럴자이"></div>
    <div class="field"><label>네이버 부동산 단지 URL 또는 단지번호 (선택, 권장)</label><input id="a-url" placeholder="https://naver.me/… 또는 https://new.land.naver.com/complexes/123456">
      <div class="help">네이버 부동산 앱/웹에서 단지 페이지를 열고 <b>공유 → 링크 복사</b>해 붙이면 정확합니다 (naver.me 짧은 링크도 OK). 비우면 다음 수집 때 이름으로 자동 검색합니다.</div></div>
    <div class="field"><label>지역 힌트 (선택, 이름 검색 정확도용)</label><input id="a-region" placeholder="예: 경기 성남시 수정구 창곡동"></div>
    <button class="btn" id="a-save">저장</button>`);
  document.getElementById('a-save').addEventListener('click', async () => {
    const name = document.getElementById('a-name').value.trim(); if (!name) return toast('단지 이름을 입력하세요');
    const url = document.getElementById('a-url').value.trim(); const m = url.match(/(?:complexes\/|complex\/info\/|hscpNo=|complexNo=)(\d+)/) || url.match(/^(\d{3,8})$/);
    if (url && !m && !/^https?:\/\/\S+$/i.test(url)) return toast('URL 형식이 아닙니다. 네이버 부동산 공유 링크(https://naver.me/… 등)를 붙여 주세요', 4000);
    const entry = { name, complexNo: m ? m[1] : null, region: document.getElementById('a-region').value.trim() };
    if (url && !m) entry.url = url;  // naver.me 등 짧은 공유 링크는 수집기 폰이 따라가서 단지번호를 알아냄
    const btn = document.getElementById('a-save'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const { cfg, sha } = await readConfigFromGithub();
      const dup = cfg.complexes.find(c => c.name === name || (entry.complexNo && String(c.complexNo) === entry.complexNo));
      if (dup && !url) throw new Error('이미 등록된 단지입니다');
      if (dup) { if (entry.complexNo) { dup.complexNo = entry.complexNo; delete dup.url; } else { dup.url = url; } if (entry.region) dup.region = entry.region; }
      else cfg.complexes.push(entry);
      await writeConfig(cfg, sha, dup ? `config: url ${name}` : `config: add ${name}`);
      S.cfg = cfg;
      toast(entry.complexNo ? '저장 완료 · 다음 수집 때 반영됩니다 (상단 ⟳로 바로 수집 가능)' : '저장 완료 · 다음 수집 때 링크/이름으로 단지번호를 찾습니다 (상단 ⟳로 바로 수집 가능)', 4500);
      closeSheet(); render();
    } catch(e){ toast('실패: ' + e.message, 4000); btn.disabled = false; btn.textContent = '저장'; }
  });
}
async function requestCollect(){
  const topic = (S.settings.topic || '').trim();
  if (!topic) { toast('⚙ 설정에서 ntfy 채널 이름을 먼저 입력하세요', 3500); return openSettings(); }
  const btn = document.getElementById('btn-collect');
  if (S.collectWatch) return toast('이미 수집 요청 중입니다 · 완료되면 알려드려요');
  const before = S.latest?.generated_at || null;
  try {
    const r = await fetch('https://ntfy.sh', { method: 'POST', body: JSON.stringify({ topic: topic + '-cmd', title: 'collect', message: 'collect ' + new Date().toISOString(), tags: ['arrows_counterclockwise'] }) });
    if (!r.ok) throw new Error('ntfy ' + r.status);
  } catch(e){ return toast('요청 실패: ' + e.message, 4000); }
  toast('수집 요청 보냈습니다 · 집 폰이 30초 내 시작, 3~5분 뒤 알림·데이터 갱신', 5000);
  btn.classList.add('busy');
  const t0 = Date.now();
  S.collectWatch = setInterval(async () => {
    const L = await getJSON('data/latest.json', null);
    if (L && L.generated_at !== before) {
      clearInterval(S.collectWatch); S.collectWatch = null; btn.classList.remove('busy');
      S.latest = L; render(); toast('수집 완료 · ' + fmt.date(L.generated_at) + ' 기준으로 갱신됨', 5000);
    } else if (Date.now() - t0 > 15*60e3) {
      clearInterval(S.collectWatch); S.collectWatch = null; btn.classList.remove('busy');
      toast('15분 내 새 데이터가 없습니다 · 집 폰의 Termux(데몬)가 켜져 있는지 확인하세요', 6000);
    }
  }, 20e3);
}
function openOrder(){
  const ord = orderComplexes(S.cfg?.complexes || []).map(c => ({ name: c.name, hidden: !!(c.hidden || S.localHidden.has(c.name)) }));
  if (!ord.length) return toast('등록된 단지가 없습니다');
  let sel = -1;
  openSheet(`<h2>단지 순서 편집</h2>
    <div class="help" style="margin:-6px 0 10px">단지를 누르면 선택되고, 다른 단지 자리를 누르면 그곳으로 이동합니다. ▲▼⤒ 버튼으로도 옮길 수 있어요. 👁 버튼으로 숨기기/보이기를 바꿉니다. 저장하면 목록·아침 알림에 함께 적용됩니다.</div>
    <div id="ord-list"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <button class="btn ghost" id="o-cancel">취소</button><button class="btn" id="o-save">저장</button></div>`);
  const listEl = document.getElementById('ord-list');
  function move(i, j){ if (j < 0 || j >= ord.length) return; const [x] = ord.splice(i,1); ord.splice(j,0,x); sel = j; draw(); }
  function draw(){
    listEl.innerHTML = ord.map((o,i) => `<div class="ord${i===sel?' mv':''}" data-i="${i}">
      <span class="num">${i+1}</span><span class="n${o.hidden?' hid':''}">${esc(o.name)}${o.hidden ? '<small>숨김</small>' : ''}</span>
      <button data-a="eye" class="eye${o.hidden?' off':''}" title="${o.hidden?'보이기':'숨기기'}">👁</button><button data-a="top" title="맨 위로" ${i===0?'disabled':''}>⤒</button><button data-a="up" title="위로" ${i===0?'disabled':''}>▲</button><button data-a="down" title="아래로" ${i===ord.length-1?'disabled':''}>▼</button></div>`).join('');
    listEl.querySelectorAll('.ord').forEach(row => {
      const i = +row.dataset.i;
      row.addEventListener('click', e => {
        const a = e.target.closest('button')?.dataset.a;
        if (a === 'eye') { ord[i].hidden = !ord[i].hidden; draw(); return; }
        if (a === 'top') return move(i, 0);
        if (a === 'up') return move(i, i-1);
        if (a === 'down') return move(i, i+1);
        if (sel >= 0 && sel !== i) { move(sel, i); return; }
        sel = sel === i ? -1 : i; draw();
      });
    });
    if (sel >= 0) listEl.querySelector('.ord.mv')?.scrollIntoView({ block: 'nearest' });
  }
  draw();
  document.getElementById('o-cancel').addEventListener('click', closeSheet);
  document.getElementById('o-save').addEventListener('click', async () => {
    const names = ord.map(o => o.name); const btn = document.getElementById('o-save');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    if (S.settings.token && repoInfo()) {
      try {
        const { cfg, sha } = await readConfigFromGithub();
        const idx = new Map(names.map((n,i)=>[n,i]));
        cfg.complexes = cfg.complexes.map((c,i)=>[idx.has(c.name)?idx.get(c.name):1e6+i, c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
        const hid = new Map(ord.map(o => [o.name, o.hidden]));
        cfg.complexes.forEach(c => { if (!hid.has(c.name)) return; if (hid.get(c.name)) c.hidden = true; else delete c.hidden; });
        await writeConfig(cfg, sha, 'config: reorder/visibility');
        S.cfg = cfg; S.localOrder = null; saveOrder(); S.localHidden = new Set(); saveHidden();
        toast('순서·숨김 저장 완료 · 알림에는 다음 수집부터 반영');
      } catch(e){ toast('실패: ' + e.message, 4000); btn.disabled = false; btn.textContent = '저장'; return; }
    } else { S.localOrder = names; saveOrder(); S.localHidden = new Set(ord.filter(o => o.hidden).map(o => o.name)); saveHidden(); toast('이 기기에만 순서·숨김을 저장했습니다 (⚙ 토큰 등록 시 알림에도 반영)', 4000); }
    closeSheet(); render();
  });
}
async function toggleHide(it){
  if (!it) return;
  const to = !isHidden(it);
  if (S.settings.token && repoInfo()) {
    try {
      const { cfg, sha } = await readConfigFromGithub();
      const c = cfg.complexes.find(x => x.name === it.name || (it.complexNo && String(x.complexNo) === String(it.complexNo)));
      if (c) { if (to) c.hidden = true; else delete c.hidden; }
      await writeConfig(cfg, sha, `config: ${to ? 'hide' : 'unhide'} ${it.name}`);
      S.cfg = cfg; S.localHidden.delete(it.name); saveHidden();
    } catch(e){ toast('실패: ' + e.message, 4000); return; }
  } else {
    if (to) S.localHidden.add(it.name); else S.localHidden.delete(it.name);
    saveHidden();
  }
  goList(); toast(to ? '숨겼습니다 (칩 "숨김"에서 다시 볼 수 있음)' : '다시 표시합니다');
}
async function removeComplex(it){
  if (!it) return;
  if (!confirm(`'${it.name}' 추적을 중단할까요?\n(지금까지 쌓인 기록 파일은 저장소에 남습니다)`)) return;
  try {
    const { cfg, sha } = await readConfigFromGithub();
    cfg.complexes = cfg.complexes.filter(c => c.name !== it.name && !(it.complexNo && String(c.complexNo) === String(it.complexNo)));
    await writeConfig(cfg, sha, `config: remove ${it.name}`);
    S.cfg = cfg; goList(); toast('제거했습니다');
  } catch(e){ toast('실패: ' + e.message, 4000); }
}
function openSettings(){
  const info = repoInfo() || {};
  const topic = S.settings.topic || '';
  openSheet(`<h2>설정</h2>
    <div class="field"><label>GitHub 저장소 (owner / repo)</label>
      <div style="display:flex;gap:6px"><input id="s-owner" placeholder="owner" value="${esc(S.settings.owner || info.owner || '')}"><input id="s-repo" placeholder="repo" value="${esc(S.settings.repo || info.repo || '')}"></div></div>
    <div class="field"><label>GitHub 개인 토큰 (fine-grained, 이 저장소의 Contents 쓰기)</label><input id="s-token" type="password" placeholder="github_pat_…" value="${esc(S.settings.token || '')}">
      <div class="help">이 기기의 브라우저에만 저장됩니다. 단지 추가/제거에 사용.</div></div>
    <div class="field"><label>ntfy 채널 이름</label><input id="s-topic" placeholder="예: jeonse-hong-3f9k2" value="${esc(topic)}">
      <div class="help">수집기 폰의 <code>local_config.json</code>과 같은 값. ntfy 앱에서 이 이름을 구독하세요. 상단 ⟳(지금 수집) 버튼도 이 채널을 통해 집 폰에 요청을 보냅니다.</div></div>
    <div class="field"><label>전월세 전환율 (%) — 환산가 계산용</label><input id="s-rate" type="number" step="0.1" value="${esc(S.cfg?.conversion_rate_pct ?? 5.5)}"><div class="help">저장 시 config에 기록되어 다음 수집부터 반영됩니다.</div></div>
    <div style="display:grid;gap:8px;margin-top:6px">
      <button class="btn" id="s-save">저장</button>
      <button class="btn ghost" id="s-test">ntfy 테스트 알림 보내기</button>
      <button class="btn ghost" id="s-reload">데이터 새로고침</button>
      <button class="btn ghost" id="s-close">닫기</button>
    </div>
    <details style="margin-top:14px" class="step"><summary>휴대폰 홈화면에 설치 / 알림 받기</summary>
      <ol><li>Play 스토어에서 <b>ntfy</b> 설치 → ＋ → 위 채널 이름 구독</li>
      <li>Chrome 메뉴(⋮) → <b>홈 화면에 추가</b> → 앱처럼 실행</li>
      <li>수집은 집에 둔 안드로이드폰(Termux)이 매일 10:00에 실행 · 상단 ⟳ 버튼으로 지금 바로 수집 요청 가능</li></ol></details>
    <div class="help" style="margin-top:10px">앱 버전 ${APP_VERSION} · <a href="https://github.com/${esc(info.owner||'')}/${esc(info.repo||'')}/commits/main" target="_blank" rel="noopener">수집 기록(커밋) ↗</a></div>`);
  document.getElementById('s-save').addEventListener('click', async () => {
    S.settings.owner = document.getElementById('s-owner').value.trim(); S.settings.repo = document.getElementById('s-repo').value.trim();
    S.settings.token = document.getElementById('s-token').value.trim(); S.settings.topic = document.getElementById('s-topic').value.trim();
    saveSettings();
    const rate = +document.getElementById('s-rate').value;
    if (S.settings.token && rate > 0 && rate !== +(S.cfg?.conversion_rate_pct ?? 0)) {
      try { const { cfg, sha } = await readConfigFromGithub(); cfg.conversion_rate_pct = rate; await writeConfig(cfg, sha, `config: rate ${rate}%`); S.cfg = cfg; toast('저장 완료 (전환율 변경 반영)'); }
      catch(e){ toast('설정은 저장, 전환율 반영 실패: ' + e.message, 4000); }
    } else toast('저장 완료');
    closeSheet(); render();
  });
  document.getElementById('s-test').addEventListener('click', async e => {
    const t = document.getElementById('s-topic').value.trim(); if (!t) return toast('ntfy 채널 이름을 입력하세요');
    e.target.disabled = true;
    try { const r = await fetch('https://ntfy.sh', { method: 'POST', body: JSON.stringify({ topic: t, title: '전월세 최저가 테스트', message: '알림 연결이 정상입니다 🏠', click: location.href }) }); toast(r.ok ? '테스트 알림을 보냈습니다' : '전송 실패 ' + r.status); }
    catch(err){ toast('전송 실패: ' + err.message); } e.target.disabled = false; });
  document.getElementById('s-reload').addEventListener('click', async () => { closeSheet(); await loadAll(); toast('새로고침 완료'); });
  document.getElementById('s-close').addEventListener('click', () => closeSheet());
}

// ------------------------------------------------------------- 이벤트/시작
const APP_VERSION = '1.9.1';
document.getElementById('btn-back').addEventListener('click', goList);
history.replaceState(null, '');  // 새로 열 때는 항상 목록부터
document.querySelectorAll('#chips .chip').forEach(x => x.classList.toggle('on', x.dataset.f === S.filter));
document.getElementById('btn-add').addEventListener('click', openAdd);
document.getElementById('btn-order').addEventListener('click', openOrder);
document.getElementById('btn-collect').addEventListener('click', requestCollect);
document.getElementById('btn-settings').addEventListener('click', openSettings);
document.querySelectorAll('#chips .chip').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('#chips .chip').forEach(x => x.classList.toggle('on', x===b)); S.filter = b.dataset.f; if (S.filter !== 'hidden' && S.filter !== 'changed') safeSet('filter', S.filter); render(); }));
window.addEventListener('popstate', () => {
  if (document.getElementById('sheet-root').firstChild) { closeSheet(true); return; }  // 시트가 열려 있으면 먼저 닫기
  if (S.view === 'detail') { S.view = 'list'; render(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - (S.loadedAt||0) > 5*60e3) { loadAll().then(()=> S.loadedAt = Date.now()); checkAppUpdate(); } });
// 앱 자동 업데이트: 앱을 열 때마다 새 sw.js 가 있는지 확인 → 새 버전이 설치되면 한 번 새로고침
function checkAppUpdate(){ if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(()=>{}); }
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller; let refreshing = false;
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !refreshing) { refreshing = true; toast('새 버전으로 업데이트합니다…'); setTimeout(() => location.reload(), 700); } });
  setTimeout(checkAppUpdate, 3000);
}
loadAll().then(() => S.loadedAt = Date.now());
</script>
